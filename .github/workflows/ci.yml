name: Verify
on: [push, pull_request]
jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.db-test.yml up -d --wait
      - run: docker compose -f compose.db-test.yml exec -T db-test psql -U postgres -d codeforge_test -v ON_ERROR_STOP=1 -f /backend/migration_v8.sql
      - run: docker compose -f compose.db-test.yml exec -T db-test psql -U postgres -d codeforge_test -v ON_ERROR_STOP=1 -f /backend/migration_v8.sql
      - run: docker compose -f compose.db-test.yml exec -T db-test psql -U postgres -d codeforge_test -v ON_ERROR_STOP=1 -f /tests/schema_contract.sql
      - run: docker compose -f compose.db-test.yml exec -T db-test psql -U postgres -d codeforge_test -v ON_ERROR_STOP=1 -f /tests/migration_v8.sql
      - run: docker compose -f compose.db-test.yml exec -T db-test psql -U postgres -d codeforge_test -v ON_ERROR_STOP=1 -f /tests/schema_contract.sql
      - run: docker compose -f compose.db-test.yml exec -T db-test psql -U postgres -d codeforge_test -v ON_ERROR_STOP=1 -f /tests/rls_isolation.sql
      - if: always()
        run: docker compose -f compose.db-test.yml logs --no-color
      - if: always()
        run: docker compose -f compose.db-test.yml down
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m compileall -q backend
      - run: python -m pytest backend/tests -q
      - run: python -m bandit -r backend -x backend/tests -ll
      - run: python -m pip_audit -r backend/requirements.txt
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://your-project.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-only
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
