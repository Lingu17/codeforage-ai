<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">CodeForge AI — Know the code. See the evidence.</title>
  <desc id="desc">Repository intelligence built with Next.js, FastAPI, Supabase and pgvector. Validate GitHub repositories, map source dependencies, retrieve relevant code, and inspect file and line citations.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#17132f"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#94a3b8" opacity=".12"/></pattern>
  </defs>
  <rect width="1200" height="460" rx="24" fill="url(#background)"/>
  <rect width="1200" height="460" rx="24" fill="url(#dots)"/>
  <path d="M700 0H1100L800 460H400Z" fill="#8b5cf6" opacity=".035"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <path d="m57 40 16-8 16 8-16 8Zm0 8 16 8 16-8M57 56l16 8 16-8" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="103" y="56" fill="#f8fafc" font-size="23" font-weight="700">CodeForge<tspan fill="#a78bfa"> AI</tspan></text>
    <text x="56" y="128" fill="#f8fafc" font-size="54" font-weight="750" letter-spacing="-2">Know the code.</text>
    <text x="56" y="190" fill="url(#accent)" font-size="54" font-weight="750" letter-spacing="-2">See the evidence.</text>
    <text x="58" y="228" fill="#cbd5e1" font-size="18">Architecture, source health, and AI answers you can trace.</text>
    <rect x="842" y="72" width="302" height="159" rx="14" fill="#0b1020" stroke="#37304f"/>
    <path d="M842 110h302" stroke="#37304f"/>
    <circle cx="861" cy="91" r="4" fill="#a78bfa"/><circle cx="876" cy="91" r="4" fill="#475569"/><circle cx="891" cy="91" r="4" fill="#475569"/>
    <text x="916" y="96" fill="#94a3b8" font-size="12">repository / intelligence</text>
    <g font-family="Consolas,Monaco,monospace" font-size="14">
      <text x="862" y="138" fill="#c4b5fd">source<tspan fill="#94a3b8"> → dependency graph</tspan></text>
      <text x="862" y="166" fill="#67e8f9">question<tspan fill="#94a3b8"> → relevant code</tspan></text>
      <text x="862" y="194" fill="#86efac">answer<tspan fill="#94a3b8"> → file + line</tspan></text>
    </g>
    <g fill="#191c30" stroke="#35354e">
      <rect x="56" y="282" width="258" height="106" rx="12"/><rect x="332" y="282" width="258" height="106" rx="12"/>
      <rect x="608" y="282" width="258" height="106" rx="12"/><rect x="884" y="282" width="260" height="106" rx="12"/>
    </g>
    <g fill="#a78bfa" font-size="12" font-weight="700" letter-spacing="2">
      <text x="76" y="309">01 / IMPORT</text><text x="352" y="309">02 / MAP</text><text x="628" y="309">03 / ASK</text><text x="904" y="309">04 / TRACE</text>
    </g>
    <g fill="#f1f5f9" font-size="17" font-weight="650">
      <text x="76" y="341">Validate the repository</text><text x="352" y="341">Understand the structure</text>
      <text x="628" y="341">Retrieve before answering</text><text x="904" y="341">Inspect the source</text>
    </g>
    <g fill="#94a3b8" font-size="13">
      <text x="76" y="367">GitHub identity + access checks</text><text x="352" y="367">Imports, cycles, source rules</text>
      <text x="628" y="367">Vector + lexical context</text><text x="904" y="367">Commit, file, line citations</text>
    </g>
    <text x="56" y="429" fill="#94a3b8" font-size="12" letter-spacing="1.6">NEXT.JS · FASTAPI · SUPABASE · PGVECTOR</text>
    <text x="1144" y="429" text-anchor="end" fill="#c4b5fd" font-size="12">Repository Intelligence Platform</text>
  </g>
</svg>
