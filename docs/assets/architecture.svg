<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc">
  <title id="title">CodeForge AI system architecture</title>
  <desc id="desc">Next.js authenticates through Supabase GitHub OAuth and sends user session requests to FastAPI. The API manages validated GitHub scans, owner-scoped PostgreSQL and pgvector storage, hybrid retrieval, Gemini embeddings and diff review, and Groq chat. Answers stream back with source citations.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#17132f"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m1 1 8 4-8 4" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m1 1 8 4-8 4" fill="none" stroke="#6ee7b7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1100" height="640" rx="20" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="42" y="40" fill="#f8fafc" font-size="25" font-weight="700">System architecture</text>
    <text x="42" y="64" fill="#94a3b8" font-size="14">User-scoped requests · persisted analysis · source citations</text>

    <g fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)">
      <path d="M290 155H425"/>
      <path d="M934 112V87H166V112" stroke-dasharray="5 5"/>
      <path d="M480 202V257H166V314"/>
      <path d="M550 202V314"/>
      <path d="M620 202V257H934V314"/>
      <path d="M290 363H425"/>
      <path d="M673 363H810" marker-start="url(#arrow)"/>
      <path d="M166 412V506"/>
      <path d="M290 553H326V447H500V412"/>
      <path d="M934 412V506"/>
      <path d="M673 155H702V473H550V506"/>
      <path d="M600 506V412"/>
    </g>
    <path d="M1058 553H1080V231H166V202" fill="none" stroke="#6ee7b7" stroke-width="1.7" stroke-dasharray="5 5" marker-end="url(#return)"/>

    <g font-size="12" fill="#c4b5fd">
      <text x="316" y="145">User session</text><text x="733" y="80">GitHub OAuth</text>
      <text x="59" y="287">Validated GitHub import</text><text x="559" y="292">Owned data</text>
      <text x="836" y="287">Repository question</text><text x="712" y="348">Retrieve</text>
      <text x="55" y="470">Embedding request</text><text x="353" y="439">Vectors</text>
      <text x="824" y="470">Retrieved context</text><text x="572" y="489">Diff</text>
    </g>
    <rect x="764" y="217" width="240" height="25" rx="6" fill="#111827"/>
    <text x="776" y="234" fill="#6ee7b7" font-size="12">SSE · answer + source citations</text>

    <g fill="#1b1d31" stroke="#42375b" stroke-width="1.2">
      <rect x="42" y="112" width="248" height="90" rx="12"/>
      <rect x="425" y="112" width="248" height="90" rx="12"/>
      <rect x="810" y="112" width="248" height="90" rx="12"/>
      <rect x="42" y="314" width="248" height="98" rx="12"/>
      <rect x="425" y="314" width="248" height="98" rx="12"/>
      <rect x="810" y="314" width="248" height="98" rx="12"/>
      <rect x="42" y="506" width="248" height="90" rx="12"/>
      <rect x="425" y="506" width="248" height="90" rx="12"/>
      <rect x="810" y="506" width="248" height="90" rx="12"/>
    </g>
    <g fill="#f1f5f9" font-size="20" font-weight="650">
      <text x="62" y="148">Next.js · React</text><text x="445" y="148">FastAPI</text><text x="830" y="148">Supabase Auth</text>
      <text x="62" y="350">Scan pipeline</text><text x="445" y="350">PostgreSQL · pgvector</text><text x="830" y="350">Hybrid retrieval</text>
      <text x="62" y="543">Gemini embeddings</text><text x="445" y="543">Gemini PR review</text><text x="830" y="543">Groq chat</text>
    </g>
    <g fill="#94a3b8" font-size="14">
      <text x="62" y="176">Dashboard + interactive reports</text><text x="445" y="176">Authenticated API + orchestration</text><text x="830" y="176">GitHub identity + user sessions</text>
      <text x="62" y="377">Parse · graph · source rules</text><text x="62" y="396">Repository code is not executed</text>
      <text x="445" y="377">Reports + 768-dimensional vectors</text><text x="445" y="396">Owner RLS + transactional RPCs</text>
      <text x="830" y="377">Vector + lexical rank fusion</text><text x="830" y="396">Bounded repository context</text>
      <text x="62" y="571">Validated vectors + bounded retries</text><text x="445" y="571">Recommendations checked to diff</text><text x="830" y="571">Grounded streaming answers</text>
    </g>
    <text x="42" y="625" fill="#94a3b8" font-size="12">High-level data flow. Provider calls and database access are orchestrated by the backend.</text>
  </g>
</svg>
